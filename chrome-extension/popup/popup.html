<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniversalDownloader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <div class="logo">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="url(#grad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <defs>
              <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#6C63FF"/>
                <stop offset="100%" style="stop-color:#4ECDC4"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <div class="header-title">
          <span class="app-name">Universal<span class="accent">DL</span></span>
          <span class="page-title" id="pageTitle">Đang tải...</span>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="refreshBtn" title="Quét lại">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="23 4 23 10 17 10"/>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
          </svg>
        </button>
        <button class="icon-btn" id="openAppBtn" title="Mở app quản lý">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
            <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Status Bar -->
    <div class="status-bar" id="statusBar">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">Kết nối backend...</span>
    </div>

    <!-- Filter Tabs -->
    <div class="filter-tabs">
      <button class="tab active" data-filter="all">
        Tất cả <span class="tab-count" id="countAll">0</span>
      </button>
      <button class="tab" data-filter="video">
        Video <span class="tab-count" id="countVideo">0</span>
      </button>
      <button class="tab" data-filter="hls">
        HLS/DASH <span class="tab-count" id="countHls">0</span>
      </button>
      <button class="tab" data-filter="audio">
        Audio <span class="tab-count" id="countAudio">0</span>
      </button>
    </div>

    <!-- Media List -->
    <div class="media-list" id="mediaList">
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="11" cy="11" r="8"/>
            <path d="m21 21-4.35-4.35"/>
          </svg>
        </div>
        <p class="empty-title">Chưa phát hiện media nào</p>
        <p class="empty-desc">Phát video trên trang để UniversalDL tự động phát hiện</p>
      </div>
    </div>

    <!-- Download Options Bar (hiện khi đã chọn) -->
    <div class="download-bar" id="downloadBar" style="display:none">
      <div class="quality-select-wrap">
        <select id="qualitySelect" class="quality-select">
          <option value="best">Tốt nhất</option>
          <option value="1080">1080p</option>
          <option value="720">720p</option>
          <option value="480">480p</option>
          <option value="360">360p</option>
          <option value="audio">Chỉ âm thanh (MP3)</option>
        </select>
      </div>
      <button class="download-btn" id="downloadBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Tải xuống
      </button>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <span id="selectedCount">0 đã chọn</span>
      <button class="link-btn" id="clearBtn">Xóa tất cả</button>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
